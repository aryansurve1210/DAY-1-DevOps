<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aryan DevOps - Day 1</title>

    <!-- CSS -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 15px #ccc;
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
        }

        h2 {
            color: #555;
            margin-bottom: 20px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 25px;
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #555;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🚀 Aryan's DevOps Journey</h1>

        <h2>Day 1 - CI/CD</h2>

        <p>
            Learning Git, GitHub and GitHub Actions.
        </p>

        <button onclick="startCICD()">
            Start CI/CD
        </button>

        <div id="message"></div>

    </div>


    <!-- JavaScript -->
    <script>
        function startCICD() {

            document.getElementById("message").innerHTML =
                "✅ CI/CD Pipeline Started Successfully!";

        }
    </script>

</body>
</html>
